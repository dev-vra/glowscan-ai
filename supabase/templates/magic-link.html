<!-- Viço — e-mail do link mágico. Colar em Supabase → Authentication → Email Templates → Magic Link.
     Assunto sugerido: "Seu link de acesso ao Viço" -->
<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#FFFBF8;font-family:Figtree,Helvetica,Arial,sans-serif;color:#2A1B14;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFFBF8;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
            <tr>
              <td style="font-size:36px;font-weight:800;letter-spacing:-1.5px;color:#B8462F;padding-bottom:24px;">viço</td>
            </tr>
            <tr>
              <td style="background:#FFFFFF;border-radius:24px;padding:32px 24px;">
                <p style="margin:0 0 8px;font-size:24px;font-weight:700;line-height:30px;">Seu link chegou.</p>
                <p style="margin:0 0 24px;font-size:16px;line-height:24px;color:#6E5C51;">Toque no botão pra entrar. Sem senha, sem complicação.</p>
                <a href="{{ .ConfirmationURL }}" style="display:block;background:#B8462F;color:#FFFFFF;text-decoration:none;text-align:center;font-weight:700;font-size:17px;line-height:56px;border-radius:999px;">Entrar no Viço</a>
                <p style="margin:24px 0 0;font-size:13px;line-height:20px;color:#6E5C51;">O link vale por 1 hora e funciona uma vez só. Se não foi você que pediu, é só ignorar este e-mail.</p>
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:12px;line-height:18px;color:#6E5C51;">Viço · Análise cosmética, não é diagnóstico médico.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
