# Viço — vico.bitrilha.com.br → container vico-web (127.0.0.1:3600)
server {
    listen 80;
    listen [::]:80;
    server_name vico.bitrilha.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vico.bitrilha.com.br;

    ssl_certificate     /etc/letsencrypt/live/vico.bitrilha.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vico.bitrilha.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Selfie/rótulo em base64 via server action (limite do app: 4 MB).
    client_max_body_size 8m;

    # APK do beta (fora do /opt/vico, que o deploy recria). Atualizar com deploy/publish-apk.sh.
    location = /download/vico.apk {
        alias /opt/vico-downloads/vico-beta.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="vico-beta.apk"';
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s; # análise da IA pode levar ~10–30 s
    }
}
